layout:
  new_paste: Créer un nouveau paste
  logo_alt: OpenGoPaste, retour à l'accueil
  tagline: "Comme pour le GoFast, il est préférable d'être caché !"
  footer: >-
    <a href="/about">OpenGoPaste</a> est un service de gestion d'extraits de
    texte et de code source. Les données envoyées par ce service ne sont connues
    que par vous seul et le(s) destinataire(s) du lien car elles sont chiffrées
    et déchiffrées par le navigateur. À aucun moment le service ne connait les
    données qui sont envoyées.

error:
  bad_request: 400 Mauvaise requête
  not_found: 404 Page non trouvée
  method_not_allowed: 405 Méthode non autorisée
  too_many_requests: 429 Trop de requêtes
  paste_not_found: Ce contenu n'a pas été trouvé
  rate_limited: Trop de requêtes depuis votre adresse. Veuillez réessayer dans une minute.
  request_too_large: Ce texte est trop long pour le service. Raccourcissez-le, ou envoyez-le en deux fois.
  javascript_required: >-
    OpenGoPaste chiffre votre texte dans votre navigateur, avant que quoi que ce
    soit n'en sorte. Cela demande JavaScript, qui est désactivé ici. Le
    formulaire reste verrouillé plutôt que d'envoyer votre texte en clair.
  insecure_context: >-
    Votre navigateur ne chiffre que sur une connexion sécurisée, et cette
    adresse n'en est pas une. Rien ne peut être protégé ici : prévenez la
    personne qui héberge ce service, et n'envoyez rien de confidentiel d'ici là.
  network: Le service n'a pas pu être joint. Vérifiez votre connexion, puis réessayez.

