about:
  intro: >-
    OpenGoPaste est un logiciel libre permettant mettre en ligne de manière
    sécurisée des notes, du code ou des textes afin de les partager.
  encryption: >-
    L'ensemble des textes ajoutés via OpenGoPaste sont chiffrés en AES 256 par
    le navigateur avant d'être envoyés au serveur afin que seul l'auteur de ces
    lignes et le ou les destinataires ne puissent accéder au contenu.
  built_by: "OpenGoPaste a été réalisé par :"
