  copy_link: Copier le lien et envoyer le.
  link_copied: "Le lien a été copié !"
  copy_action: Copier le lien
  copy_failed: Le lien n'a pas pu être copié. Sélectionnez-le, puis copiez-le à la main.
  send_by_email: Envoyer le lien par courriel
  saving: Chiffrement et envoi en cours…
  encryption_failed: Votre navigateur n'a pas pu chiffrer ce texte. Rien n'a été envoyé.
  save_error: Ce contenu n'a pas pu être enregistré. Veuillez réessayer.
  expire_in: Expire dans
  format: Format
  max_read: Nombre de lecture maximum
